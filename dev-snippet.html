     Paste this <script> block just before </body>
─────────────────────────────────────────────────────────── -->
<script>
(function () {
  const PAGE_URL = encodeURIComponent('https://sohqureshi.github.io/Java-Fullstack-Developer---Interview-Guide/');
  const PAGE_TITLE = encodeURIComponent('Java Full Stack Interview Guide — free senior-level Q&A covering Spring Boot, Microservices, Java 21, System Design & more');

  const liBtn = document.getElementById('shareLinkedInBtn');
  if (liBtn) {
    liBtn.addEventListener('click', function () {
      window.open(
        'https://www.linkedin.com/sharing/share-offsite/?url=' + PAGE_URL,
        '_blank', 'noopener,width=600,height=500'
      );
    });
  }

  const rdBtn = document.getElementById('shareRedditBtn');
  if (rdBtn) {
    rdBtn.addEventListener('click', function () {
      window.open(
        'https://www.reddit.com/submit?url=' + PAGE_URL + '&title=' + PAGE_TITLE,
        '_blank', 'noopener,width=700,height=600'
      );
    });
  }
})();
</script>
