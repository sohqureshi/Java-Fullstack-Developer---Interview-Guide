                            <div class="answer-section">
                                <h4>The Four Pillars of Object-Oriented Programming</h4>
                                <p>OOP is built on four fundamental pillars that help you write scalable, maintainable code. Let's break down each one:</p>
                            </div>

                            <div class="answer-section">
                                <h4>1️⃣ Encapsulation</h4>
                                <p><strong>Definition:</strong> Bundling data (variables) and methods into a single unit (class) and hiding internal implementation details from the outside world.</p>
                                <p><strong>How it works:</strong> Use access modifiers (private, protected, public) to control what information is exposed.</p>
                                <div class="code-block"><code>// Without Encapsulation (BAD)
public class BankAccount {
    public double balance;  // Anyone can change this!
}

// With Encapsulation (GOOD)
public class BankAccount {
    private double balance;  // Hidden from outside
    
    public double getBalance() {
        return balance;
    }
    
    public void deposit(double amount) {
        if (amount > 0) {
            balance += amount;  // Validation happens here
        }
    }
}</code></div>
                                <div class="tip">Encapsulation protects your data from invalid states. For example, balance can never go negative because the setter validates it.</div>
                            </div>

                            <div class="answer-section">
                                <h4>2️⃣ Inheritance</h4>
                                <p><strong>Definition:</strong> A child class inherits properties and methods from a parent class, promoting code reuse.</p>
                                <p><strong>Key Concept:</strong> It creates an "is-a" relationship. A SavingsAccount IS-A BankAccount.</p>
                                <div class="code-block"><code>// Parent class
public class BankAccount {
    protected double balance;
    
    public void withdraw(double amount) {
        if (amount <= balance) {
            balance -= amount;
        }
    }
}

// Child class inherits from parent
public class SavingsAccount extends BankAccount {
    private double interestRate;
    
    public void applyInterest() {
        balance += balance * interestRate;  // Uses inherited balance
    }
}</code></div>
                                <div class="important">In Java, a class can extend only ONE parent class (single inheritance). To avoid the "diamond problem", use interfaces for multiple inheritance of type.</div>
                            </div>

                            <div class="answer-section">
                                <h4>3️⃣ Polymorphism</h4>
                                <p><strong>Definition:</strong> "Many forms" - the ability of an object to take multiple forms or for methods to behave differently based on context.</p>
                                <p><strong>Two Types:</strong></p>
                                <ul>
                                    <li><strong>Compile-time (Static) Polymorphism:</strong> Method Overloading - same method name, different parameters</li>
                                    <li><strong>Runtime (Dynamic) Polymorphism:</strong> Method Overriding - child class redefines parent's method</li>
                                </ul>
                                <div class="code-block"><code>// Method Overloading (Compile-time)
public class Calculator {
    public int add(int a, int b) {
        return a + b;
    }
    
    public double add(double a, double b) {  // Same name, different params
        return a + b;
    }
}

// Method Overriding (Runtime)
public class Animal {
    public void sound() {
        System.out.println("Animal makes sound");
    }
}

public class Dog extends Animal {
    @Override
    public void sound() {  // Overrides parent's method
        System.out.println("Dog barks");
    }
}

// Runtime polymorphism in action
Animal animal = new Dog();  // Reference is Animal, object is Dog
animal.sound();  // Prints "Dog barks" - JVM decides at runtime</code></div>
                                <div class="tip">This is the key to building flexible, extensible code. You can pass Dog, Cat, or Bird where Animal is expected, and each will behave differently.</div>
                            </div>

                            <div class="answer-section">

                                <div class="code-block"><code>// Abstract Class - defines contract but hides implementation
public abstract class PaymentProcessor {
    public abstract void processPayment(double amount);
    
    public void logTransaction(double amount) {
        System.out.println("Transaction: " + amount);
    }
}

// Concrete implementations
public class CreditCardPayment extends PaymentProcessor {
    @Override
    public void processPayment(double amount) {
        // Implementation specific to credit cards
        System.out.println("Processing credit card payment");
    }
}

public class UPIPayment extends PaymentProcessor {
    @Override
    public void processPayment(double amount) {
        // Implementation specific to UPI
        System.out.println("Processing UPI payment");
    }
}

// Client code doesn't know HOW payment works, just calls it
PaymentProcessor processor = new CreditCardPayment();
processor.processPayment(100.0);</code></div>

                                    <li>✅ <strong>Polymorphism:</strong> Same interface, different behaviors</li>
                                    <li>✅ <strong>Abstraction:</strong> Hide complexity, show only what's needed</li>
                                </ul>

                                <h4>Intermediate vs Terminal Operations</h4>
                                <div class="comparison-grid">
                                    <div class="comparison-box">
                                        <h4>Intermediate (Lazy)</h4>
                                        <p>Return a Stream. Executed only when needed.</p>
                                        <ul>
                                            <li>filter() - keep matching</li>
                                            <li>map() - transform</li>
                                            <li>flatMap() - flatten</li>
                                            <li>distinct()</li>
                                            <li>sorted()</li>
                                            <li>limit()</li>
                                            <li>peek() - debug</li>
                                        </ul>
                                    </div>
                                    <div class="comparison-box">
                                        <h4>Terminal (Eager)</h4>
                                        <p>Produce a result. Close the stream.</p>
                                        <ul>
                                            <li>collect() - gather to collection</li>
                                            <li>forEach() - iterate</li>
                                            <li>reduce() - combine</li>
                                            <li>count() - size</li>
                                            <li>findFirst() - get one</li>
                                            <li>anyMatch() - boolean</li>
                                            <li>toArray()</li>
                                        </ul>
                                    </div>
                                </div>
                            </div>

                            <div class="answer-section">
                                <h4>Complete Example</h4>
                                <div class="code-block"><code>List&lt;Employee&gt; employees = List.of(
    new Employee("Alice", "Engineering", 80000),
    new Employee("Bob", "Sales", 50000),
    new Employee("Charlie", "Engineering", 90000),
    new Employee("Diana", "HR", 60000)
);

// Find engineering employees with salary > 75k, sorted by name
List&lt;String&gt; result = employees.stream()
    .filter(e -> e.getDepartment().equals("Engineering"))  // Intermediate
    .filter(e -> e.getSalary() > 75000)                     // Intermediate
    .map(Employee::getName)                                  // Intermediate
    .sorted()                                                // Intermediate
    .collect(Collectors.toList());                          // Terminal

System.out.println(result);  // [Alice, Charlie]</code></div>
                            </div>

                            <div class="answer-section">
                                <h4>Collectors for Complex Operations</h4>
                                <div class="code-block"><code>// Group by department
Map&lt;String, List&lt;Employee&gt;&gt; byDept = employees.stream()
    .collect(Collectors.groupingBy(Employee::getDepartment));

// Count employees per department
Map&lt;String, Long&gt; counts = employees.stream()
    .collect(Collectors.groupingBy(Employee::getDepartment, 
                                   Collectors.counting()));

// Calculate average salary by department
Map&lt;String, Double&gt; avgSalary = employees.stream()
    .collect(Collectors.groupingBy(Employee::getDepartment,
                                   Collectors.averagingDouble(Employee::getSalary)));

// Partition into two groups (salary > 70k or not)
Map&lt;Boolean, List&lt;Employee&gt;&gt; highEarners = employees.stream()
    .collect(Collectors.partitioningBy(e -> e.getSalary() > 70000));</code></div>
                            </div>

                            <div class="tip">For parallel streams use .parallelStream(), but be careful with ordering and side-effects. It's not always faster – only use when processing large datasets.</div>
                        `

                        q: "Explain database indexing and when NOT to index",
                        a: `
                            <div class="answer-section">
                                <h4>What is an Index?</h4>
                                <p>An index is a data structure (usually B-Tree) that allows fast data lookup. Without an index, every query must scan every row (table scan).</p>
                                <div class="code-block"><code>-- Without index: scans 1,000,000 rows
SELECT * FROM users WHERE email = 'alice@example.com';

-- With index: finds in ~10-15 lookups (log(n))
CREATE INDEX idx_email ON users(email);
SELECT * FROM users WHERE email = 'alice@example.com';  -- Fast!</code></div>
                            </div>

                            <div class="answer-section">
                                <h4>Types of Indexes</h4>
                                <table>
                                    <tr>
                                        <th>Type</th>
                                        <th>Use Case</th>
                                        <th>Example</th>
                                    </tr>
                                    <tr>
                                        <td><strong>B-Tree (Default)</strong></td>
                                        <td>Range queries, equality, ORDER BY</td>
                                        <td>WHERE age BETWEEN 20 AND 30</td>
                                    </tr>
                                    <tr>
                                        <td><strong>Hash</strong></td>
                                        <td>Exact match only</td>
                                        <td>WHERE id = 5</td>
                                    </tr>
                                    <tr>
                                        <td><strong>Full-Text</strong></td>
                                        <td>Text search</td>
                                        <td>WHERE MATCH(description)</td>
                                    </tr>
                                    <tr>
                                        <td><strong>Bitmap</strong></td>
                                        <td>Low cardinality columns</td>
                                        <td>WHERE status IN ('active', 'inactive')</td>
                                    </tr>
                                </table>
                            </div>

                            <div class="answer-section">
                                <h4>Composite Indexes - The Left-Prefix Rule</h4>
                                <div class="code-block"><code>-- Create composite index on (department, salary)
CREATE INDEX idx_dept_salary ON employees(department, salary);

-- This index is used for:
SELECT * FROM employees WHERE department = 'Engineering';  ✅

-- This index is used for:
SELECT * FROM employees WHERE department = 'Engineering' AND salary > 80000;  ✅

-- This index is NOT used (starts with salary, not department):
SELECT * FROM employees WHERE salary > 80000;  ❌

// In Spring Data JPA
@Entity
public class Employee {
    @Index(columnList = "department,salary")
    private String department;
    private double salary;
}</code></div>
                            </div>

                            <div class="answer-section">
                                <h4>When NOT to Index</h4>
                                <ul>
                                    <li><strong>Low cardinality columns:</strong> gender, status. Index overhead not worth it (yes/no options)</li>
                                    <li><strong>Frequently written tables:</strong> Each INSERT/UPDATE/DELETE must update the index (expensive)</li>
                                    <li><strong>Rarely queried columns:</strong> You're paying index maintenance cost for zero benefit</li>
                                    <li><strong>Small tables:</strong> Full table scan might be faster than index lookup</li>
                                    <li><strong>Columns with many NULLs:</strong> Most databases don't index NULLs efficiently</li>
                                </ul>
                            </div>

                            <div class="answer-section">
                                <h4>Verify Index Usage with EXPLAIN</h4>
                                <div class="code-block"><code>-- Check if index is used
EXPLAIN ANALYZE SELECT * FROM users WHERE email = 'alice@example.com';

Output:
Seq Scan on users  (cost=0.00..35.50 rows=1)  ❌ Full table scan
Filter: email = 'alice@example.com'

-- After creating index:
EXPLAIN ANALYZE SELECT * FROM users WHERE email = 'alice@example.com';

Output:
Index Scan using idx_email on users  ✅ Index used
(cost=0.29..8.30 rows=1)
Index Cond: email = 'alice@example.com'</code></div>
                            </div>

                            <div class="tip">Always use EXPLAIN before and after adding an index. Sometimes indexes don't help as expected or make things worse!</div>
                        `
                    }
                ]
