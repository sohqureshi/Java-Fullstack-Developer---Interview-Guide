                                <h4>The Four Pillars of Object-Oriented Programming</h4>
                                <p>OOP is built on four fundamental pillars that help you write scalable, maintainable code. Let's break down each one:</p>
                            </div>

                            <div class="answer-section">
                                <h4>1️⃣ Encapsulation</h4>
                                <p><strong>Definition:</strong> Bundling data (variables) and methods into a single unit (class) and hiding internal implementation details from the outside world.</p>
                                <p><strong>How it works:</strong> Use access modifiers (private, protected, public) to control what information is exposed.</p>

    public double getBalance() {

    }
    
    public void deposit(double amount) {

                                <div class="tip">Encapsulation protects your data from invalid states. For example, balance can never go negative because the setter validates it.</div>

                            <div class="answer-section">

public class BankAccount {

    public void withdraw(double amount) {

}

// Child class inherits from parent

    public void applyInterest() {

    }
}</code></div>

                        q: "Explain virtual threads in Java 21. How are they different from platform threads?",
                        a: `
                            <div class="answer-section">
                                <h4>What are Virtual Threads?</h4>
                                <p>Virtual threads are lightweight threads managed by the JVM instead of being mapped one-to-one to operating system threads. They are designed for applications that spend a lot of time waiting on blocking I/O, such as REST calls, database calls, file I/O, or message broker operations.</p>
                                <div class="code-block"><code>try (var executor = Executors.newVirtualThreadPerTaskExecutor()) {
    for (int i = 0; i < 10_000; i++) {
        executor.submit(() -> {
            var response = callRemoteService();
            saveResult(response);
            return response;
        });
    }
}</code></div>
                            </div>

                            <div class="answer-section">
                                <h4>Platform Threads vs Virtual Threads</h4>
                                <table>
                                    <tr>
                                        <th>Point</th>
                                        <th>Platform Thread</th>
                                        <th>Virtual Thread</th>
                                    </tr>
                                    <tr>
                                        <td>Managed by</td>
                                        <td>Operating system</td>
                                        <td>JVM scheduler</td>
                                    </tr>
                                    <tr>
                                        <td>Cost</td>
                                        <td>Expensive, limited count</td>
                                        <td>Cheap, millions possible in suitable workloads</td>
                                    </tr>
                                    <tr>
                                        <td>Best for</td>
                                        <td>CPU-heavy work</td>
                                        <td>I/O-heavy blocking work</td>
                                    </tr>
                                    <tr>
                                        <td>Programming style</td>
                                        <td>Often needs pools/reactive style at scale</td>
                                        <td>Simple thread-per-task style</td>
                                    </tr>
                                </table>
                            </div>

                            <div class="answer-section">
                                <h4>Important Caveats</h4>
                                <ul>
                                    <li>Virtual threads do not make CPU-bound code faster. CPU-bound tasks still need a sensible limit based on available cores.</li>
                                    <li>Avoid pooling virtual threads. They are cheap; create them per task.</li>
                                    <li>Watch for thread pinning when synchronized blocks or native calls block the carrier thread.</li>

                                        <li>Scalable, resilient</li>

// Modern way (non-blocking)

public class UserService {
    @Autowired
    private WebClient webClient;
    
    public Mono&lt;User&gt; getUser(Long id) {

            .uri("http://user-service/users/{id}", id)

    }
}

// Consumer
@Service

    public void handleOrderCreated(Order order) {

@Service
public class PaymentService {
    @CircuitBreaker(name = "payment-service", fallbackMethod = "fallback")
    @Retry(name = "payment-service")
    @Timeout(name = "payment-service")
    public void processPayment(Order order) {
        // If external service fails, automatically open circuit
        externalPaymentAPI.charge(order);
    }
    
    private void fallback(Order order, Exception ex) {

        paymentQueue.add(order);
        log.warn("Payment queued for later", ex);

                                <div class="code-block"><code>@Service
class TransferService {
    @Transactional
    public void transfer(long fromId, long toId, BigDecimal amount) {
        accountRepository.debit(fromId, amount);
        accountRepository.credit(toId, amount);
        auditRepository.save(new AuditEntry(fromId, toId, amount));
    }
}</code></div>
                            </div>

                            <div class="answer-section">
                                <h4>Common Pitfalls</h4>
                                <ul>
                                    <li><strong>Self-invocation:</strong> calling a transactional method from another method in the same class bypasses the proxy.</li>
                                    <li><strong>Checked exceptions:</strong> they do not roll back by default unless configured with <code>rollbackFor</code>.</li>
                                    <li><strong>Long transactions:</strong> holding DB locks while calling external APIs hurts scalability.</li>
                                    <li><strong>Wrong propagation:</strong> understand <code>REQUIRED</code>, <code>REQUIRES_NEW</code>, and <code>MANDATORY</code>.</li>
                                </ul>
                                <div class="tip">Keep transactions short and only around database work. Publish events after commit when external side effects are involved.</div>
                            </div>

                        a: `
                            <div class="answer-section">
                                <h4>What is an Index?</h4>
                                <p>An index is a data structure (usually B-Tree) that allows fast data lookup. Without an index, every query must scan every row (table scan).</p>
                                <div class="code-block"><code>-- Without index: scans 1,000,000 rows
SELECT * FROM users WHERE email = 'alice@example.com';

-- With index: finds in ~10-15 lookups (log(n))
CREATE INDEX idx_email ON users(email);
SELECT * FROM users WHERE email = 'alice@example.com';  -- Fast!</code></div>
                            </div>

                            <div class="answer-section">
                                <h4>Types of Indexes</h4>
                                <table>
                                    <tr>
                                        <th>Type</th>
                                        <th>Use Case</th>
                                        <th>Example</th>
                                    </tr>
                                    <tr>
                                        <td><strong>B-Tree (Default)</strong></td>
                                        <td>Range queries, equality, ORDER BY</td>
                                        <td>WHERE age BETWEEN 20 AND 30</td>
                                    </tr>
                                    <tr>
                                        <td><strong>Hash</strong></td>
                                        <td>Exact match only</td>
                                        <td>WHERE id = 5</td>
                                    </tr>
                                    <tr>
                                        <td><strong>Full-Text</strong></td>
                                        <td>Text search</td>
                                        <td>WHERE MATCH(description)</td>
                                    </tr>
                                    <tr>
                                        <td><strong>Bitmap</strong></td>
                                        <td>Low cardinality columns</td>
                                        <td>WHERE status IN ('active', 'inactive')</td>
                                    </tr>
                                </table>
                            </div>

                            <div class="answer-section">
                                <h4>Composite Indexes - The Left-Prefix Rule</h4>
                                <div class="code-block"><code>-- Create composite index on (department, salary)
CREATE INDEX idx_dept_salary ON employees(department, salary);

-- This index is used for:
SELECT * FROM employees WHERE department = 'Engineering';  ✅

-- This index is used for:
SELECT * FROM employees WHERE department = 'Engineering' AND salary > 80000;  ✅

-- This index is NOT used (starts with salary, not department):
SELECT * FROM employees WHERE salary > 80000;  ❌

// In Spring Data JPA
@Entity
public class Employee {
    @Index(columnList = "department,salary")
    private String department;
    private double salary;
}</code></div>
                            </div>

                            <div class="answer-section">
                                <h4>When NOT to Index</h4>
                                <ul>
                                    <li><strong>Low cardinality columns:</strong> gender, status. Index overhead not worth it (yes/no options)</li>
                                    <li><strong>Frequently written tables:</strong> Each INSERT/UPDATE/DELETE must update the index (expensive)</li>
                                    <li><strong>Rarely queried columns:</strong> You're paying index maintenance cost for zero benefit</li>
                                    <li><strong>Small tables:</strong> Full table scan might be faster than index lookup</li>
                                    <li><strong>Columns with many NULLs:</strong> Most databases don't index NULLs efficiently</li>
                                </ul>
                            </div>

                            <div class="answer-section">
                                <h4>Verify Index Usage with EXPLAIN</h4>
                                <div class="code-block"><code>-- Check if index is used
EXPLAIN ANALYZE SELECT * FROM users WHERE email = 'alice@example.com';

Output:
Seq Scan on users  (cost=0.00..35.50 rows=1)  ❌ Full table scan
Filter: email = 'alice@example.com'

-- After creating index:
EXPLAIN ANALYZE SELECT * FROM users WHERE email = 'alice@example.com';

Output:
Index Scan using idx_email on users  ✅ Index used
(cost=0.29..8.30 rows=1)
Index Cond: email = 'alice@example.com'</code></div>
                            </div>

                            <div class="tip">Always use EXPLAIN before and after adding an index. Sometimes indexes don't help as expected or make things worse!</div>
                        `

                                <div class="code-block"><code>// Generate from database ID
// ID = 1 → Base62 = "B"
// ID = 62 → Base62 = "10"
// ID = 3844 → Base62 = "100"

public String encodeToBase62(long id) {
    String base62 = "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz";
    StringBuilder sb = new StringBuilder();
    while (id > 0) {
        sb.insert(0, base62.charAt((int)(id % 62)));
        id /= 62;
    }
    return sb.toString();
}</code></div>
                                <p><strong>Advantages:</strong> No collisions, predictable, easy to scale</p>

                                Duration.ofDays(1));

                            <div class="answer-section">
                                <h4>Reliability Building Blocks</h4>
                                <ul>

                                    <li><strong>Retries with backoff:</strong> retry transient failures without overwhelming downstream systems.</li>
                                    <li><strong>Circuit breakers:</strong> fail fast when a dependency is unhealthy.</li>
                                    <li><strong>Bulkheads:</strong> isolate resources so one failing dependency does not consume every thread or connection.</li>
                                    <li><strong>Idempotency:</strong> safely retry create/update operations using an idempotency key.</li>

                                <p>Distributed systems often cannot update every service atomically. Instead, one service commits its local transaction and publishes an event. Other services consume the event and update their own state.</p>
                                <div class="code-block"><code>// Outbox pattern idea
BEGIN;
INSERT INTO orders(id, status) VALUES (?, 'CREATED');
INSERT INTO outbox(event_type, payload) VALUES ('OrderCreated', ?);
COMMIT;

// Background publisher reads outbox and sends to Kafka/RabbitMQ</code></div>
                                <p>The outbox pattern prevents the common bug where the database commit succeeds but event publishing fails.</p>

                                <li>Avoid unbounded arrays that grow forever.</li>
                            </ul>
                        </div>

                        <div class="answer-section">
                            <h4>Good vs Risky Modeling</h4>
                            <div class="code-block"><code>// Good: bounded recent events embedded
{
  "_id": "customer-1",
  "name": "Alice",
  "recentOrders": [
    { "orderId": "o1", "total": 120, "createdAt": ISODate("2026-06-11") }
  ]
}

// Risky: unbounded array can grow forever
{
  "_id": "product-1",
  "allPageViews": [ /* millions of entries */ ]
}</code></div>
                            <p>For unbounded data, create a separate collection and index by the parent ID plus time or status.</p>
                        </div>

                        <div class="answer-section">
                            <h4>Production Checklist</h4>
                            <ul>
                                <li>Create compound indexes that match filters and sort order.</li>
                                <li>Use schema validation to protect important fields.</li>
                                <li>Use optimistic locking or version fields for concurrent updates.</li>
                                <li>Design shard keys with high cardinality and even write distribution.</li>
                                <li>Monitor slow queries, index usage, replication lag, and working set size.</li>
                            </ul>
                            <div class="important">MongoDB is flexible, but production systems still need schema discipline. Flexible schema does not mean no schema.</div>
                        </div>
                    `
                }
            ]
        };

        // Helpers: ID sanitization and localStorage for read questions
        function sanitizeId(str) {
            return String(str).replace(/\s+/g, '_').replace(/[^\w\-]/g, '').toLowerCase();
        }

        function getReadSet() {
            try {
                const raw = localStorage.getItem('readQuestions');
                const arr = raw ? JSON.parse(raw) : [];
                return new Set(arr);
            } catch (e) {
                return new Set();
            }
        }

        function saveReadSet(set) {
            try {
                const arr = Array.from(set);
                localStorage.setItem('readQuestions', JSON.stringify(arr));
            } catch (e) {
                console.warn('Could not save read set', e);
            }
        }

        function onReadToggleClick(e) {
            // Prevent the parent question click from toggling
            e.stopPropagation();
            const btn = e.currentTarget || e.target;
            const qid = btn.dataset.id;
            if (!qid) return;
            const readSet = getReadSet();
            const willBeRead = !readSet.has(qid);
            if (willBeRead) readSet.add(qid); else readSet.delete(qid);
            saveReadSet(readSet);
            // Update UI
            btn.classList.toggle('read', willBeRead);
            btn.setAttribute('aria-pressed', willBeRead ? 'true' : 'false');
            btn.textContent = willBeRead ? 'Read ✓' : 'Mark as read';
            const questionEl = btn.closest('.question');
            if (questionEl) questionEl.classList.toggle('read', willBeRead);
            // Update topic progress bars
            updateTopicProgressBars();
        }

        function markQuestionReadById(qid, checked) {
            const btn = document.querySelector(`.read-toggle[data-id="${qid}"]`);
            if (btn) {
                btn.classList.toggle('read', !!checked);
                btn.setAttribute('aria-pressed', !!checked);
                btn.textContent = !!checked ? 'Read ✓' : 'Mark as read';
                const questionEl = btn.closest('.question');
                if (questionEl) questionEl.classList.toggle('read', !!checked);
                // Update topic progress bars
                updateTopicProgressBars();
            }
        }

        function getTopicCoverage(topic) {
            const readSet = getReadSet();
            const questions = topicsData[topic]?.questions || [];
            let readCount = 0;
            questions.forEach((q, idx) => {
                const qid = `${sanitizeId(topic)}-${idx}`;
                if (readSet.has(qid)) readCount++;
            });
            const total = questions.length;
            return { readCount, total, percentage: total > 0 ? Math.round((readCount / total) * 100) : 0 };
        }

        function updateTopicProgressBars() {
            document.querySelectorAll('[data-topic]').forEach(btn => {
                const topic = btn.dataset.topic;
                const { percentage } = getTopicCoverage(topic);
                const progressBar = btn.querySelector('.topic-progress-bar');
                const pctSpan = btn.querySelector('.topic-coverage-pct');
                if (progressBar) progressBar.style.width = percentage + '%';
                if (pctSpan) pctSpan.textContent = `${percentage}%`;
            });
        }

        // Initialize UI
        function initializeUI() {
            const navButtons = document.getElementById('navButtons');
            for (const topic in topicsData) {
                const btn = document.createElement('button');
                const { percentage } = getTopicCoverage(topic);
                btn.innerHTML = `
                    <div class="topic-btn-label">
                        <span class="name">${topicsData[topic].icon} ${topic}</span>
                        <div class="topic-progress">
                            <div class="topic-progress-bar" style="width: ${percentage}%"></div>
                        </div>
                        <span class="topic-coverage-pct">${percentage}%</span>
                    </div>
                `;
                btn.dataset.topic = topic;
                btn.className = topic === Object.keys(topicsData)[0] ? 'active' : '';
                btn.addEventListener('click', () => selectTopic(topic, btn));
                navButtons.appendChild(btn);
            }

            // Display first topic
            selectTopic(Object.keys(topicsData)[0], navButtons.querySelector('button'));
        }

        function selectTopic(topic, btn) {
            // Update buttons
            document.querySelectorAll('.nav-buttons button').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            // Render content
            const contentArea = document.getElementById('contentArea');
            const topicData = topicsData[topic];

            const readSet = getReadSet();
            let html = `<h2>${topicData.icon} ${topic}</h2>`;
            topicData.questions.forEach((q, idx) => {
                const qid = `${sanitizeId(topic)}-${idx}`;
                const isRead = readSet.has(qid);
                const readClass = isRead ? ' read' : '';
                const checkedAttr = isRead ? 'checked' : '';
                html += `
                    <div class="question${readClass}" data-qid="${qid}">
                        <h3>
                            <div class="question-top">
                                <button type="button" class="read-toggle ${isRead ? 'read' : ''}" data-id="${qid}" aria-pressed="${isRead ? 'true' : 'false'}" onclick="onReadToggleClick(event)">${isRead ? 'Read ✓' : 'Mark as read'}</button>
                            </div>
                                <div class="question-line">
                                <span class="question-text"><span class="q-badge">Q${idx + 1}</span>${q.q}</span>
                                <span class="toggle"><i class="fas fa-chevron-down"></i></span>
                            </div>
                        </h3>
                        <div class="question-body">${q.a}</div>
                    </div>
                `;
            });

            contentArea.innerHTML = html;
            // highlight code after rendering
            highlightAllCodeBlocks();
            updateExpandCollapseButtons();
        }

        function toggleQuestion(el) {
            el.classList.toggle('open');
            updateExpandCollapseButtons();
        }

        // Lightweight tokenizer-based highlighter for code blocks (Java-like)
        function escapeHtml(str) {
            return String(str).replace(/[&<>"']/g, function (m) {
                return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":"&#39;"})[m];
            });
        }

        function highlightCode(raw) {
            const keywords = new Set(["public","private","protected","class","interface","extends","implements","new","return","if","else","for","while","switch","case","break","continue","try","catch","finally","void","int","long","double","float","boolean","char","static","final","import","package","this","super","throws","throw","enum","record","var","const"]);
            let i = 0, len = raw.length, out = '';
            while (i < len) {
                const ch = raw[i];
                // multiline comment
                if (raw.startsWith('/*', i)) {
                    const end = raw.indexOf('*/', i+2);
                    const j = end === -1 ? len : end+2;
                    out += '<span class="token comment">' + escapeHtml(raw.slice(i, j)) + '</span>';
                    i = j; continue;
                }
                // line comment
                if (raw.startsWith('//', i)) {
                    const end = raw.indexOf('\n', i+2);
                    const j = end === -1 ? len : end;
                    out += '<span class="token comment">' + escapeHtml(raw.slice(i, j)) + '</span>';
                    i = j; continue;
                }
                // string
                if (ch === '"' || ch === "'") {
                    const quote = ch;
                    let j = i+1;
                    while (j < len) {
                        if (raw[j] === '\\') { j += 2; continue; }
                        if (raw[j] === quote) { j++; break; }
                        j++;
                    }
                    out += '<span class="token string">' + escapeHtml(raw.slice(i, j)) + '</span>';
                    i = j; continue;
                }
                // number
                const numMatch = raw.slice(i).match(/^\d+(?:\.\d+)?/);
                if (numMatch) {
                    out += '<span class="token number">' + escapeHtml(numMatch[0]) + '</span>';
                    i += numMatch[0].length; continue;
                }
                // identifier/keyword
                const idMatch = raw.slice(i).match(/^[_$A-Za-z][_\w$]*/);
                if (idMatch) {
                    const id = idMatch[0];
                    if (keywords.has(id)) {
                        out += '<span class="token keyword">' + escapeHtml(id) + '</span>';
                    } else if (/^[A-Z][A-Za-z0-9_]*$/.test(id)) {
                        out += '<span class="token type">' + escapeHtml(id) + '</span>';
                    } else {
                        out += escapeHtml(id);
                    }
                    i += id.length; continue;
                }
                // default: escape char
                out += escapeHtml(ch);
                i++;
            }
            return out;
        }

        function highlightAllCodeBlocks() {
            document.querySelectorAll('.code-block code').forEach(codeEl => {
                const raw = codeEl.textContent || '';
                const highlighted = highlightCode(raw);
                const lines = highlighted.split('\n');
                const gutterHtml = lines.map((_, idx) => `<span class="ln">${idx+1}</span>`).join('');
                const codeHtml = lines.map(line => `<div class="code-line">${line || ' '}</div>`).join('');
                const editorHtml = `<div class="code-editor"><div class="gutter">${gutterHtml}</div><div class="code-content"><pre>${codeHtml}</pre></div></div>`;
                // Replace the parent .code-block innerHTML with editorHtml
                const parent = codeEl.closest('.code-block');
                if (parent) parent.innerHTML = editorHtml;
            });
        }

        // Search functionality and toolbar actions
        function escapeHtml(str) {
            return String(str).replace(/[&<>"']/g, function (m) {
                return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":"&#39;"})[m];
            });
        }

        function renderFilteredResults(query) {
            const q = String(query || '').trim().toLowerCase();
            const contentArea = document.getElementById('contentArea');
            const feedback = document.getElementById('searchFeedback');

            if (!q) {
                const activeBtn = document.querySelector('.nav-buttons button.active');
                if (activeBtn) {
                    selectTopic(activeBtn.dataset.topic, activeBtn);
                } else {
                    selectTopic(Object.keys(topicsData)[0], document.querySelector('.nav-buttons button'));
                }
                feedback.textContent = '';
                return;
            }

            // Clear active nav state while showing search results
            document.querySelectorAll('.nav-buttons button').forEach(b => b.classList.remove('active'));

            const readSet = getReadSet();
            let html = '';
            let total = 0;
            let topicCount = 0;

            for (const topic in topicsData) {
                const matches = topicsData[topic].questions.filter(qItem => {
                    return qItem.q.toLowerCase().includes(q) || (qItem.a && qItem.a.toLowerCase().includes(q));
                });

                if (matches.length) {
                    topicCount++;
                    html += `<h2>${topicsData[topic].icon} ${topic}</h2>`;
                    matches.forEach((qItem) => {
                        total++;
                        const idxInTopic = topicsData[topic].questions.indexOf(qItem);
                        const qid = `${sanitizeId(topic)}-${idxInTopic}`;
                        const isRead = readSet.has(qid);
                        const readClass = isRead ? ' read' : '';
                        const checkedAttr = isRead ? 'checked' : '';
                        html += `
                            <div class="question${readClass}" data-qid="${qid}">
                                <h3>
                                    <div class="question-top">
                                        <button type="button" class="read-toggle ${isRead ? 'read' : ''}" data-id="${qid}" aria-pressed="${isRead ? 'true' : 'false'}" onclick="onReadToggleClick(event)">${isRead ? 'Read ✓' : 'Mark as read'}</button>
                                    </div>
                                            <div class="question-line">
                                                <span class="question-text"><span class="q-badge">${total}</span>${escapeHtml(qItem.q)}</span>
                                                <span class="toggle"><i class="fas fa-chevron-down"></i></span>
                                            </div>
                                </h3>
                                <div class="question-body">${qItem.a}</div>
                            </div>
                        `;
                    });
                }
            }

            if (total === 0) {
                contentArea.innerHTML = `<div class="empty-state">No results for "${escapeHtml(query)}"</div>`;
            } else {
                contentArea.innerHTML = html;
            }

            // Highlight code blocks and add line numbers
            highlightAllCodeBlocks();
            feedback.textContent = `${total} result${total !== 1 ? 's' : ''} across ${topicCount} topic${topicCount !== 1 ? 's' : ''}`;
            updateExpandCollapseButtons();
        }

        document.getElementById('searchBox').addEventListener('input', function (e) {
            renderFilteredResults(e.target.value);
        });

        function getMarkedReadQuestions() {
            document.querySelectorAll('.nav-buttons button').forEach(b => b.classList.remove('active'));
            const contentArea = document.getElementById('contentArea');
            const readSet = getReadSet();
            let html = '';
            let count = 0;

            if (readSet.size === 0) {
                contentArea.innerHTML = '<div class="empty-state">No questions marked as read yet</div>';
                document.getElementById('searchFeedback').textContent = '';
                return;
            }

            for (const topic in topicsData) {
                const topicData = topicsData[topic];
                let topicHasRead = false;
                let topicHtml = '';

                topicData.questions.forEach((q, idx) => {
                    const qid = `${sanitizeId(topic)}-${idx}`;
                    if (!readSet.has(qid)) return;
                    topicHasRead = true;
                    count++;

                    topicHtml += `
                        <div class="question read" data-qid="${qid}">
                            <h3>
                                <div class="question-top">
                                    <button type="button" class="read-toggle read" data-id="${qid}" aria-pressed="true" onclick="onReadToggleClick(event)">Read ✓</button>
                                </div>
                                <div class="question-line">
                                    <span class="question-text"><span class="q-badge">Q${idx + 1}</span>${q.q}</span>
                                    <span class="toggle"><i class="fas fa-chevron-down"></i></span>
                                </div>
                            </h3>
                            <div class="question-body">${q.a}</div>
                        </div>
                    `;
                });

                if (topicHasRead) {
                    html += `<h2>${topicData.icon} ${topic}</h2>${topicHtml}`;
                }
            }

            contentArea.innerHTML = html;
            highlightAllCodeBlocks();
            updateExpandCollapseButtons();
            document.getElementById('searchFeedback').textContent = `${count} question${count !== 1 ? 's' : ''} marked as read`;
        }

        function renderAllTopics() {
            document.querySelectorAll('.nav-buttons button').forEach(b => b.classList.remove('active'));
            const contentArea = document.getElementById('contentArea');
            const readSet = getReadSet();
            let html = '';
            for (const topic in topicsData) {
                const topicData = topicsData[topic];
                html += `<h2>${topicData.icon} ${topic}</h2>`;
                topicData.questions.forEach((q, idx) => {
                    const qid = `${sanitizeId(topic)}-${idx}`;
                    const isRead = readSet.has(qid);
                    const readClass = isRead ? ' read' : '';
                    const checkedAttr = isRead ? 'checked' : '';
                    html += `
                        <div class="question${readClass}" data-qid="${qid}">
                            <h3>
                                <div class="question-top">
                                    <button type="button" class="read-toggle ${isRead ? 'read' : ''}" data-id="${qid}" aria-pressed="${isRead ? 'true' : 'false'}" onclick="onReadToggleClick(event)">${isRead ? 'Read ✓' : 'Mark as read'}</button>
                                </div>
                                    <div class="question-line">
                                    <span class="question-text"><span class="q-badge">Q${idx + 1}</span>${q.q}</span>
                                    <span class="toggle"><i class="fas fa-chevron-down"></i></span>
                                </div>
                            </h3>
                            <div class="question-body">${q.a}</div>
                        </div>
                    `;
                });
            }
            contentArea.innerHTML = html;
            // Highlight code blocks and add line numbers
            highlightAllCodeBlocks();
            updateExpandCollapseButtons();
            document.getElementById('searchFeedback').textContent = '';
        }

        function expandAllQuestions() {
            document.querySelectorAll('.question').forEach(q => q.classList.add('open'));
            updateExpandCollapseButtons();
        }

        function collapseAllQuestions() {
            document.querySelectorAll('.question').forEach(q => q.classList.remove('open'));
            updateExpandCollapseButtons();
        }

        function updateExpandCollapseButtons() {
            const anyOpen = document.querySelectorAll('.question.open').length > 0;
            const expandBtn = document.getElementById('expandAllBtn');
            const collapseBtn = document.getElementById('collapseAllBtn');
            if (expandBtn && collapseBtn) {
                if (anyOpen) {
                    expandBtn.classList.add('hidden');
                    collapseBtn.classList.remove('hidden');
                } else {
                    expandBtn.classList.remove('hidden');
                    collapseBtn.classList.add('hidden');
                }
            }
        }

        // Wire toolbar buttons
        document.getElementById('allTopicsBtn').addEventListener('click', renderAllTopics);
        document.getElementById('expandAllBtn').addEventListener('click', expandAllQuestions);
        document.getElementById('getMarkedReadBtn').addEventListener('click', getMarkedReadQuestions);
        document.getElementById('collapseAllBtn').addEventListener('click', collapseAllQuestions);

        // Delegated handler for toggling individual questions (reliable for dynamic content)
        document.addEventListener('click', function (e) {
            const toggleHit = e.target.closest('.question-line, .toggle');
            if (!toggleHit) return;
            // Prevent toggling when clicking the read-toggle button
            if (e.target.closest('.read-toggle')) return;
            const question = toggleHit.closest('.question');
            if (question) toggleQuestion(question);
        });

        // More menu (mobile)
        const moreBtn = document.getElementById('moreActionsBtn');
        const moreMenu = document.getElementById('moreActionsMenu');
        if (moreBtn && moreMenu) {
            moreBtn.addEventListener('click', function (e) {
                e.stopPropagation();
                const open = moreMenu.style.display === 'block';
                moreMenu.style.display = open ? 'none' : 'block';
                moreBtn.setAttribute('aria-expanded', String(!open));
                moreMenu.setAttribute('aria-hidden', String(open));
            });

            moreMenu.addEventListener('click', function (e) {
                const btn = e.target.closest('button[data-action]');
                if (!btn) return;
                const action = btn.dataset.action;
                if (action === 'all') renderAllTopics();
                if (action === 'expand') expandAllQuestions();
                if (action === 'getmarked') getMarkedReadQuestions();
                if (action === 'collapse') collapseAllQuestions();
                moreMenu.style.display = 'none';
                moreBtn.setAttribute('aria-expanded', 'false');
                moreMenu.setAttribute('aria-hidden', 'true');
            });

            // close on outside click
            document.addEventListener('click', function () {
                moreMenu.style.display = 'none';
                moreBtn.setAttribute('aria-expanded', 'false');
                moreMenu.setAttribute('aria-hidden', 'true');
            });
        }

        // Back to top button
        window.addEventListener('scroll', function () {
            const btn = document.getElementById('backToTop');
            btn.classList.toggle('show', window.scrollY > 300);
        });

        document.getElementById('backToTop').addEventListener('click', function () {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        // Initialize on load
        initializeUI();
    </script>
