<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Advanced Budget Calculator</title>

<style>
body{
    font-family:Arial, sans-serif;
    background:#f4f6f9;
    margin:0;
    padding:20px;
}
.container{
    max-width:850px;
    margin:auto;
    background:#fff;
    padding:20px;
    border-radius:12px;
    box-shadow:0 5px 15px rgba(0,0,0,.15);
}
h2{
    text-align:center;
    color:#1f4e79;
}
.section{
    margin-top:25px;
}
.item{
    display:grid;
    grid-template-columns:2fr 1fr auto;
    gap:10px;
    margin-bottom:10px;
}
input{
    padding:10px;
    font-size:15px;
}
button{
    padding:10px 15px;
    border:none;
    border-radius:6px;
    cursor:pointer;
}
.addBtn{
    background:#28a745;
    color:white;
}
.removeBtn{
    background:#dc3545;
    color:white;
}
.summary{
    margin-top:30px;
    padding:20px;
    border-radius:10px;
    background:#eef4ff;
}
.summary h3{
    margin-top:0;
}
.total{
    font-size:18px;
    margin:8px 0;
}
.balance{
    font-size:22px;
    font-weight:bold;
}
.positive{
    color:green;
}
.negative{
    color:red;
}
</style>

</head>

<body>

<div class="container">

<h2>💰 Advanced Monthly Budget Calculator</h2>

<div class="section">
<h3>Income</h3>

<div id="incomeList"></div>

<button class="addBtn" onclick="addIncome()">+ Add Income</button>

</div>

<div class="section">
<h3>Debits</h3>

<div id="debitList"></div>

<button class="addBtn" onclick="addDebit()">+ Add Debit</button>

</div>

<div class="summary">
<h3>Summary</h3>

<div class="total">Total Income:
₹<span id="incomeTotal">0</span></div>

<div class="total">Total Expenses:
₹<span id="expenseTotal">0</span></div>

<div class="balance">
Remaining Balance:
₹<span id="balance">0</span>
</div>

</div>

</div>

<script>

function createRow(containerId,name="",amount=0){

    const row=document.createElement("div");
    row.className="item";

    row.innerHTML=`
        <input type="text" placeholder="Description" value="${name}">
        <input type="number" placeholder="Amount" value="${amount}">
        <button class="removeBtn">❌</button>
    `;

    row.querySelectorAll("input").forEach(i=>{
        i.addEventListener("input",calculate);
    });

    row.querySelector("button").onclick=function(){
        row.remove();
        calculate();
    };

    document.getElementById(containerId).appendChild(row);

}

function addIncome(){
    createRow("incomeList","",0);
}

function addDebit(){
    createRow("debitList","",0);
}

function sum(containerId){

    let total=0;

    document.querySelectorAll("#"+containerId+" .item").forEach(row=>{
        total+=Number(row.children[1].value)||0;
    });

    return total;

}

function calculate(){

    let income=sum("incomeList");
    let expense=sum("debitList");
    let balance=income-expense;

    document.getElementById("incomeTotal").innerHTML=income.toLocaleString();
    document.getElementById("expenseTotal").innerHTML=expense.toLocaleString();

    let bal=document.getElementById("balance");

    bal.innerHTML=balance.toLocaleString();

    if(balance>=0){
        bal.className="positive";
    }else{
        bal.className="negative";
    }

}

// Default Income
createRow("incomeList","Salary",0);

// Default Debits
createRow("debitList","Home Loan",30000);
createRow("debitList","Car Loan",12400);
createRow("debitList","Loan from Family",12000);
createRow("debitList","Grocery & Maintenance",10000);
createRow("debitList","Electricity Bill",10000);
createRow("debitList","Medical Expenses",10000);
createRow("debitList","Miscellaneous",10000);

calculate();

</script>

</body>
</html>
