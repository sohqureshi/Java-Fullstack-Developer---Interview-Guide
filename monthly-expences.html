<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monthly Budget Planner</title>

<style>
    :root {
        --primary: #1f4e79;
        --success: #28a745;
        --danger: #ff4757;
        --accent: #4a9eff;
    }

    body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
        background: linear-gradient(180deg, #f8f9fc, #eef1f7);
        margin: 0;
        padding: 12px;
        line-height: 1.6;
        color: #333;
    }

    .container {
        max-width: 920px;
        margin: auto;
        background: white;
        border-radius: 20px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        overflow: hidden;
    }

    header {
        background: linear-gradient(135deg, var(--primary), #2a6a9e);
        color: white;
        padding: 22px;
        text-align: center;
    }

    h1 { margin: 0; font-size: 1.85rem; font-weight: 600; }
    .subtitle { opacity: 0.9; font-size: 1.05rem; margin-top: 6px; }

    .main-content { padding: 24px; }

    .section { margin-bottom: 34px; }

    .section-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 14px;
    }

    .section h3 { margin: 0; color: var(--primary); font-size: 1.35rem; }
    .section-total { font-weight: 700; color: var(--accent); font-size: 1.15rem; }

    .item {
        display: grid;
        grid-template-columns: 2fr 1fr 48px;
        gap: 12px;
        margin-bottom: 12px;
        padding: 14px 16px;
        border: 1px solid #f0f0f0;
        border-radius: 14px;
        background: #fafcff;
        align-items: center;
        position: relative;
        transition: all 0.25s ease;
    }

    .item:hover {
        border-color: #c3d9ff;
        box-shadow: 0 6px 16px rgba(74,158,255,0.12);
    }

    input {
        padding: 14px 16px;
        font-size: 16px;
        border: 1.5px solid #e0e0e0;
        border-radius: 10px;
        width: 100%;
    }
