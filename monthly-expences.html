<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Advanced Budget Calculator</title>

<style>
    :root {
        --primary: #1f4e79;
        --success: #28a745;
        --danger: #ff4757;
    }

    body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
        background: #f4f6f9;
        margin: 0;
        padding: 12px;
        line-height: 1.5;
    }

    .container {
        max-width: 900px;
        margin: auto;
        background: #fff;
        padding: 20px;
        border-radius: 16px;
        box-shadow: 0 8px 25px rgba(0,0,0,0.1);
    }

    h2 {
        text-align: center;
        color: var(--primary);
        margin: 0 0 20px 0;
        font-size: 1.6rem;
    }

    .section {
        margin-top: 28px;
    }

    .section h3 {
        margin: 0 0 12px 0;
        color: var(--primary);
        font-size: 1.25rem;
    }

    .item {
        display: grid;
        grid-template-columns: 2fr 1fr 48px;
        gap: 10px;
        margin-bottom: 12px;
        padding: 12px;
        border: 1px solid #eee;
        border-radius: 12px;
        background: #fafafa;
        align-items: center;
    }

    input {
        padding: 12px 14px;
        font-size: 16px; /* Better for mobile */
        border: 1px solid #ddd;
        border-radius: 8px;
        width: 100%;
    }

    .removeBtn {
        background: var(--danger);
        color: white;
        border: none;
        width: 40px;
        height: 40px;
        border-radius: 50%;
        cursor: pointer;
        font-size: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        box-shadow: 0 2px 6px rgba(255,71,87,0.3);
    }

    .addBtn {
        background: var(--success);
        color: white;
        padding: 14px 20px;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        font-size: 16px;
        font-weight: 500;
        width: 100%;
        margin-top: 8px;
    }

    .summary {
        margin-top: 32px;
        padding: 24px;
        border-radius: 16px;
        background: linear-gradient(135deg, #eef4ff, #f0f7ff);
        border: 1px solid #c3d9ff;
    }

    .total {
        font-size: 1.1rem;
        margin: 14px 0;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .balance {
        font-size: 1.55rem;
        font-weight: bold;
        margin-top: 18px;
        padding-top: 18px;
        border-top: 2px solid #c3d9ff;
    }

    .positive { color: #2ed573; }
    .negative { color: var(--danger); }

    /* ==================== MOBILE RESPONSIVE ==================== */
    @media (max-width: 768px) {
        body { padding: 10px; }
        
        .container {
            padding: 16px;
            border-radius: 14px;
        }

        h2 { font-size: 1.45rem; }

        .item {
            grid-template-columns: 1fr 1fr 44px;
            padding: 14px 12px;
            gap: 8px;
        }

        .removeBtn {
            width: 38px;
            height: 38px;
            font-size: 18px;
        }
    }

    @media (max-width: 480px) {
        .item {
            grid-template-columns: 1fr; /* Stack fully on small phones */
            gap: 10px;
        }

        input {
            font-size: 15.5px; /* iOS friendly */
        }

        .addBtn {
            padding: 16px;
        }

        .summary {
            padding: 20px;
        }

        .balance {
            font-size: 1.45rem;
        }
    }
</style>

</head>

<body>

<div class="container">

<h2>💰 Monthly Budget Calculator</h2>

<div class="section">
<h3>Income</h3>
<div id="incomeList"></div>
<button class="addBtn" onclick="addIncome()">+ Add Income</button>
</div>

<div class="section">
<h3>Expenses</h3>
<div id="debitList"></div>
<button class="addBtn" onclick="addDebit()">+ Add Expense</button>
</div>

<div class="summary">
<h3>Summary</h3>

<div class="total">Total Income: <span id="incomeTotal">₹0</span></div>
<div class="total">Total Expenses: <span id="expenseTotal">₹0</span></div>

<div class="balance">
    Remaining: <span id="balance">₹0</span>
</div>
</div>

</div>

<script>
function createRow(containerId, name="", amount=0){
    const row = document.createElement("div");
    row.className = "item";

    row.innerHTML = `
        <input type="text" placeholder="Description" value="${name}">
        <input type="number" placeholder="₹ Amount" value="${amount}" min="0">
        <button class="removeBtn" title="Remove">×</button>
    `;

    row.querySelectorAll("input").forEach(i => {
        i.addEventListener("input", calculate);
    });

    row.querySelector(".removeBtn").onclick = () => {
        row.style.opacity = "0";
        setTimeout(() => {
            row.remove();
            calculate();
        }, 250);
    };

    document.getElementById(containerId).appendChild(row);
}

function addIncome(){ createRow("incomeList"); }
function addDebit(){ createRow("debitList"); }

function sum(containerId){
    let total = 0;
    document.querySelectorAll("#"+containerId+" .item input[type='number']").forEach(input => {
        total += Number(input.value) || 0;
    });
    return total;
}

function calculate(){
    let income = sum("incomeList");
    let expense = sum("debitList");
    let balance = income - expense;

    document.getElementById("incomeTotal").textContent = "₹" + income.toLocaleString('en-IN');
    document.getElementById("expenseTotal").textContent = "₹" + expense.toLocaleString('en-IN');

    const balEl = document.getElementById("balance");
    balEl.textContent = "₹" + balance.toLocaleString('en-IN');
    balEl.className = balance >= 0 ? "positive" : "negative";
}

// Default entries
createRow("incomeList", "Salary", 0);
createRow("debitList", "Home Loan", 30000);
createRow("debitList", "Car Loan", 12400);
createRow("debitList", "Loan from Family", 12000);
createRow("debitList", "Grocery & Maintenance", 10000);
createRow("debitList", "Electricity Bill", 10000);
createRow("debitList", "Medical Expenses", 10000);
createRow("debitList", "Miscellaneous", 10000);

calculate();
</script>

</body>
</html>
