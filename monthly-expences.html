<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monthly Budget Planner</title>

<style>
    :root {
        --primary: #1f4e79;
        --success: #28a745;
        --danger: #ff4757;
        --accent: #4a9eff;
    }

    body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
        background: linear-gradient(180deg, #f8f9fc, #eef1f7);
        margin: 0;
        padding: 12px;
        line-height: 1.6;
        color: #333;
    }

    .container {
        max-width: 920px;
        margin: auto;
        background: white;
        border-radius: 20px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        overflow: hidden;
    }

    header {
        background: linear-gradient(135deg, var(--primary), #2a6a9e);
        color: white;
        padding: 20px;
        text-align: center;
    }

    h1 {
        margin: 0;
        font-size: 1.8rem;
        font-weight: 600;
    }

    .subtitle {
        opacity: 0.9;
        font-size: 1rem;
        margin-top: 4px;
    }

    .main-content {
        padding: 24px;
    }

    .section {
        margin-bottom: 32px;
    }

    .section-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
    }

    .section h3 {
        margin: 0;
        color: var(--primary);
        font-size: 1.3rem;
    }

    .section-total {
        font-weight: 600;
        color: var(--accent);
    }

    .item {
        display: grid;
        grid-template-columns: 2fr 1fr 48px;
        gap: 12px;
        margin-bottom: 10px;
        padding: 14px;
        border: 1px solid #f0f0f0;
        border-radius: 14px;
        background: #fafcff;
        align-items: center;
        position: relative;
        transition: all 0.2s ease;
    }

    .item:hover {
        border-color: #d0e0ff;
        box-shadow: 0 4px 12px rgba(74,158,255,0.1);
    }

    input {
        padding: 13px 15px;
        font-size: 16px;
        border: 1.5px solid #e0e0e0;
        border-radius: 10px;
        width: 100%;
        transition: border 0.2s;
    }

    input:focus {
        border-color: var(--accent);
        outline: none;
    }

    .removeBtn {
        background: var(--danger);
        color: white;
        border: none;
        width: 42px;
        height: 42px;
        border-radius: 50%;
        cursor: pointer;
        font-size: 22px;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 3px 8px rgba(255,71,87,0.3);
    }

    .addBtn {
        background: var(--success);
        color: white;
        padding: 15px;
        border: none;
        border-radius: 12px;
        cursor: pointer;
        font-size: 16.5px;
        font-weight: 600;
        width: 100%;
        margin-top: 10px;
        box-shadow: 0 4px 12px rgba(40,167,69,0.25);
    }

    .summary {
        background: #f8fbff;
        padding: 28px;
        border-radius: 18px;
        border: 2px solid #e0eeff;
        text-align: center;
    }

    .balance {
        font-size: 2rem;
        font-weight: 700;
        margin: 16px 0;
    }

    .positive { color: #2ed573; }
    .negative { color: var(--danger); }

    /* Swipe support */
    .item.swiping { transition: none; }

    @media (max-width: 768px) {
        .main-content { padding: 18px; }
        .item { grid-template-columns: 1fr 1fr 46px; }
        h1 { font-size: 1.6rem; }
    }

    @media (max-width: 480px) {
        .item { grid-template-columns: 1fr; gap: 10px; }
        .balance { font-size: 1.75rem; }
    }
</style>
</head>

<body>

<div class="container">
    <header>
        <h1>💰 Budget Planner</h1>
        <p class="subtitle">Track your monthly income & expenses</p>
    </header>

    <div class="main-content">

        <div class="section">
            <div class="section-header">
                <h3>Income</h3>
                <span id="incomeSectionTotal" class="section-total">₹0</span>
            </div>
            <div id="incomeList"></div>
            <button class="addBtn" onclick="addIncome()">+ Add Income</button>
        </div>

        <div class="section">
            <div class="section-header">
                <h3>Expenses</h3>
                <span id="expenseSectionTotal" class="section-total">₹0</span>
            </div>
            <div id="debitList"></div>
            <button class="addBtn" onclick="addDebit()">+ Add Expense</button>
        </div>

        <div class="summary">
            <h3>Overall Summary</h3>
            <div style="margin:20px 0;">
                <div style="font-size:1.1rem;margin:8px 0;">Total Income: <span id="incomeTotal">₹0</span></div>
                <div style="font-size:1.1rem;margin:8px 0;">Total Expenses: <span id="expenseTotal">₹0</span></div>
            </div>
            <div class="balance" id="balanceContainer">
                Remaining Balance: <span id="balance">₹0</span>
            </div>
        </div>

    </div>
</div>

<script>
const storageKey = "budgetData";

function saveData() {
    const data = {
        income: [],
        expenses: []
    };
    
    document.querySelectorAll("#incomeList .item").forEach(item => {
        const inputs = item.querySelectorAll("input");
        data.income.push({
            desc: inputs[0].value,
            amount: parseFloat(inputs[1].value) || 0
        });
    });
    
    document.querySelectorAll("#debitList .item").forEach(item => {
        const inputs = item.querySelectorAll("input");
        data.expenses.push({
            desc: inputs[0].value,
            amount: parseFloat(inputs[1].value) || 0
        });
    });
    
    localStorage.setItem(storageKey, JSON.stringify(data));
}

function loadData() {
    const saved = localStorage.getItem(storageKey);
    if (!saved) return false;
    
    try {
        const data = JSON.parse(saved);
        
        // Clear current
        document.getElementById("incomeList").innerHTML = "";
        document.getElementById("debitList").innerHTML = "";
        
        data.income.forEach(item => createRow("incomeList", item.desc, item.amount));
        data.expenses.forEach(item => createRow("debitList", item.desc, item.amount));
        return true;
    } catch(e) {
        return false;
    }
}

function createRow(containerId, name="", amount=0){
    const row = document.createElement("div");
    row.className = "item";

    row.innerHTML = `
        <input type="text" placeholder="What is this for?" value="${name}">
        <input type="number" placeholder="₹ Amount" value="${amount}" min="0" step="0.01">
        <button class="removeBtn" title="Remove">×</button>
    `;

    const inputs = row.querySelectorAll("input");
    inputs.forEach(input => {
        input.addEventListener("input", () => {
            calculate();
            saveData();
        });
    });

    addSwipeToDelete(row);

    row.querySelector(".removeBtn").onclick = () => removeRow(row);

    document.getElementById(containerId).appendChild(row);
}

function removeRow(row) {
    row.style.opacity = "0";
    row.style.transform = "translateX(-30px)";
    setTimeout(() => {
        row.remove();
        calculate();
        saveData();
    }, 300);
}

function addSwipeToDelete(row) {
    let startX = 0, currentX = 0, isSwiping = false;
    const threshold = 90;

    row.addEventListener('touchstart', e => {
        startX = currentX = e.touches[0].clientX;
        isSwiping = true;
        row.classList.add('swiping');
    }, { passive: true });

    row.addEventListener('touchmove', e => {
        if (!isSwiping) return;
        currentX = e.touches[0].clientX;
        const diff = Math.min(0, currentX - startX); // only left
        row.style.transform = `translateX(${diff}px)`;
    }, { passive: true });

    row.addEventListener('touchend', () => {
        if (!isSwiping) return;
        isSwiping = false;
        row.classList.remove('swiping');

        const diff = currentX - startX;
        if (diff < -threshold) {
            removeRow(row);
        } else {
            row.style.transition = 'transform 0.3s ease';
            row.style.transform = 'translateX(0)';
        }
    });
}

function sum(containerId){
    let total = 0;
    document.querySelectorAll("#"+containerId+" input[type='number']").forEach(input => {
        total += parseFloat(input.value) || 0;
    });
    return total;
}

function calculate(){
    const income = sum("incomeList");
    const expense = sum("debitList");
    const balance = income - expense;

    // Update main totals
    document.getElementById("incomeTotal").textContent = "₹" + income.toLocaleString('en-IN');
    document.getElementById("expenseTotal").textContent = "₹" + expense.toLocaleString('en-IN');
    
    // Section totals
    document.getElementById("incomeSectionTotal").textContent = "₹" + income.toLocaleString('en-IN');
    document.getElementById("expenseSectionTotal").textContent = "₹" + expense.toLocaleString('en-IN');

    const balEl = document.getElementById("balance");
    balEl.textContent = "₹" + balance.toLocaleString('en-IN');
    balEl.className = balance >= 0 ? "positive" : "negative";
}

// Initialize
if (!loadData()) {
    // Default values only on first load
    createRow("incomeList", "Salary", 85000);
    createRow("debitList", "Home Rent", 25000);
    createRow("debitList", "Groceries", 12000);
    createRow("debitList", "Electricity & Internet", 4500);
}

calculate();
</script>

</body>
</html>
