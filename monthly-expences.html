<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monthly Expense Planner</title>

<style>
    :root {
        --page: #f5f7fb;
        --surface: #ffffff;
        --surface-soft: #f8fafc;
        --ink: #172033;
        --muted: #667085;
        --line: #dfe5ee;
        --primary: #2457c5;
        --primary-dark: #163e94;
        --income: #15803d;
        --income-soft: #eaf8ef;
        --expense: #c2410c;
        --expense-soft: #fff1e8;
        --danger: #c93535;
        --shadow: 0 18px 44px rgba(25, 35, 60, 0.10);
    }

    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
        background: var(--page);
        color: var(--ink);
        line-height: 1.45;
    }

    button,
    input,
    select {
        font: inherit;
    }

    button {
        cursor: pointer;
    }

    .app-shell {
        width: min(1180px, calc(100% - 32px));
        margin: 24px auto;
    }

    .app-header {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 20px;
        align-items: end;
        padding: 28px;
        color: #fff;
        background: linear-gradient(135deg, var(--primary-dark), var(--primary));
        border-radius: 8px;
        box-shadow: var(--shadow);
    }

    .eyebrow {
        margin: 0 0 8px;
        color: rgba(255, 255, 255, 0.76);
        font-size: 0.78rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
    }

    h1 {
        margin: 0;
        font-size: clamp(2rem, 5vw, 3.7rem);
        line-height: 1;
        font-weight: 800;
        letter-spacing: 0;
    }

    .header-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 18px;
    }

    .status-pill {
        display: inline-flex;
        align-items: center;
        min-height: 34px;
        padding: 7px 11px;
        border: 1px solid rgba(255, 255, 255, 0.24);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.13);
        color: rgba(255, 255, 255, 0.92);
        font-size: 0.9rem;
        white-space: nowrap;
    }

    .month-controls {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.14);
    }

    .icon-button {
        width: 40px;
        height: 40px;
        border: 1px solid rgba(255, 255, 255, 0.28);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.14);
        color: #fff;
        font-size: 1.35rem;
        line-height: 1;
    }

    .icon-button:hover {
        background: rgba(255, 255, 255, 0.24);
    }

    .month-select {
        min-width: 176px;
        height: 40px;
        border: 0;
        border-radius: 8px;
        padding: 0 12px;
        color: var(--ink);
        background: #fff;
        font-weight: 700;
        outline: none;
    }

    .summary-strip {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 14px;
        margin: 18px 0;
    }

    .metric {
        min-height: 112px;
        padding: 18px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface);
        box-shadow: 0 8px 22px rgba(25, 35, 60, 0.06);
    }

    .metric-label {
        margin: 0 0 8px;
        color: var(--muted);
        font-size: 0.82rem;
        font-weight: 800;
        letter-spacing: 0.07em;
        text-transform: uppercase;
    }

    .metric-value {
        margin: 0;
        font-size: clamp(1.35rem, 2.4vw, 2rem);
        font-weight: 800;
        line-height: 1.05;
        overflow-wrap: anywhere;
    }

    .metric-note {
        margin-top: 8px;
        color: var(--muted);
        font-size: 0.9rem;
    }

    .income-text {
        color: var(--income);
    }

    .expense-text {
        color: var(--expense);
    }

    .negative {
        color: var(--danger);
    }

    .planner-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 18px;
        align-items: start;
    }

    .panel {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface);
        box-shadow: 0 12px 26px rgba(25, 35, 60, 0.07);
        overflow: hidden;
    }

    .panel-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 18px;
        border-bottom: 1px solid var(--line);
        background: var(--surface-soft);
    }

    .panel-title {
        margin: 0;
        font-size: 1.08rem;
    }

    .section-total {
        font-weight: 800;
        white-space: nowrap;
    }

    .panel-body {
        padding: 14px;
    }

    .list {
        display: grid;
        gap: 10px;
    }

    .item {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(116px, 160px) 40px;
        gap: 10px;
        align-items: center;
        padding: 10px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fff;
        transition: border-color 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
    }

    .item:hover {
        border-color: #b8c7df;
        box-shadow: 0 10px 20px rgba(36, 87, 197, 0.09);
    }

    .field {
        display: grid;
        gap: 5px;
        min-width: 0;
    }

    .field span {
        color: var(--muted);
        font-size: 0.73rem;
        font-weight: 800;
        letter-spacing: 0.06em;
        text-transform: uppercase;
    }

    input,
    select {
        width: 100%;
        min-width: 0;
        border: 1px solid #cfd8e5;
        border-radius: 8px;
        background: #fff;
        color: var(--ink);
    }

    input {
        height: 44px;
        padding: 0 12px;
    }

    input:focus,
    select:focus {
        border-color: var(--primary);
        outline: 3px solid rgba(36, 87, 197, 0.14);
    }

    .amount-input {
        text-align: right;
        font-weight: 700;
    }

    .remove-btn {
        align-self: end;
        width: 40px;
        height: 44px;
        border: 1px solid #f2c4c4;
        border-radius: 8px;
        background: #fff7f7;
        color: var(--danger);
        font-size: 1.45rem;
        line-height: 1;
    }

    .remove-btn:hover {
        background: #ffe9e9;
    }

    .add-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        min-height: 46px;
        margin-top: 12px;
        border: 0;
        border-radius: 8px;
        color: #fff;
        font-weight: 800;
    }

    .add-income {
        background: var(--income);
    }

    .add-expense {
        background: var(--expense);
    }

    .add-income:hover {
        background: #116532;
    }

    .add-expense:hover {
        background: #9a3412;
    }

    .progress-area {
        margin-top: 18px;
        padding: 18px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface);
    }

    .progress-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 10px;
        color: var(--muted);
        font-weight: 800;
    }

    .progress-track {
        height: 14px;
        overflow: hidden;
        border-radius: 999px;
        background: #e8edf5;
    }

    .progress-fill {
        width: 0%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, var(--income), var(--primary));
        transition: width 0.25s ease, background 0.25s ease;
    }

    .progress-fill.over {
        background: linear-gradient(90deg, #f97316, var(--danger));
    }

    .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
    }

    .item.swiping {
        transition: none;
    }

    @media (max-width: 920px) {
        .app-header {
            grid-template-columns: 1fr;
            align-items: start;
        }

        .summary-strip {
            grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .planner-grid {
            grid-template-columns: 1fr;
        }
    }

    @media (max-width: 620px) {
        .app-shell {
            width: min(100% - 20px, 1180px);
            margin: 10px auto;
        }

        .app-header,
        .metric,
        .progress-area {
            padding: 16px;
        }

        .summary-strip {
            grid-template-columns: 1fr;
            gap: 10px;
        }

        .month-controls {
            width: 100%;
            justify-content: space-between;
        }

        .month-select {
            min-width: 0;
            flex: 1;
        }

        .item {
            grid-template-columns: 1fr 44px;
        }

        .item .field:first-child {
            grid-column: 1 / -1;
        }
    }
</style>
</head>

<body>
<main class="app-shell">
    <header class="app-header">
        <div>
            <p class="eyebrow">Monthly Expense Planner</p>
            <h1 id="activeMonth">This Month</h1>
            <div class="header-meta">
                <span class="status-pill" id="saveStatus">Saved automatically</span>
                <span class="status-pill" id="rowCount">0 entries</span>
            </div>
        </div>

        <div class="month-controls" aria-label="Month controls">
            <button class="icon-button" type="button" id="prevMonth" aria-label="Previous month" title="Previous month">&lsaquo;</button>
            <label class="sr-only" for="monthSelect">Month</label>
            <select class="month-select" id="monthSelect"></select>
            <button class="icon-button" type="button" id="nextMonth" aria-label="Next month" title="Next month">&rsaquo;</button>
        </div>
    </header>

    <section class="summary-strip" aria-label="Monthly summary">
        <article class="metric">
            <p class="metric-label">Income</p>
            <p class="metric-value income-text" id="incomeTotal">Rs. 0</p>
            <div class="metric-note" id="incomeCount">0 sources</div>
        </article>

        <article class="metric">
            <p class="metric-label">Expenses</p>
            <p class="metric-value expense-text" id="expenseTotal">Rs. 0</p>
            <div class="metric-note" id="expenseCount">0 items</div>
        </article>

        <article class="metric">
            <p class="metric-label">Remaining</p>
            <p class="metric-value" id="balance">Rs. 0</p>
            <div class="metric-note" id="balanceNote">No spending yet</div>
        </article>

        <article class="metric">
            <p class="metric-label">Spent</p>
            <p class="metric-value" id="spentRate">0%</p>
            <div class="metric-note">of monthly income</div>
        </article>
    </section>

    <section class="planner-grid">
        <section class="panel" aria-labelledby="incomeHeading">
            <div class="panel-header">
                <h2 class="panel-title" id="incomeHeading">Income</h2>
                <span id="incomeSectionTotal" class="section-total income-text">Rs. 0</span>
            </div>
            <div class="panel-body">
                <div class="list" id="incomeList"></div>
                <button class="add-btn add-income" type="button" id="addIncomeBtn">Add income</button>
            </div>
        </section>

        <section class="panel" aria-labelledby="expenseHeading">
            <div class="panel-header">
                <h2 class="panel-title" id="expenseHeading">Expenses</h2>
                <span id="expenseSectionTotal" class="section-total expense-text">Rs. 0</span>
            </div>
            <div class="panel-body">
                <div class="list" id="debitList"></div>
                <button class="add-btn add-expense" type="button" id="addDebitBtn">Add expense</button>
            </div>
        </section>
    </section>

    <section class="progress-area" aria-label="Spending progress">
        <div class="progress-head">
            <span>Monthly spending</span>
            <span id="progressLabel">0% used</span>
        </div>
        <div class="progress-track">
            <div class="progress-fill" id="progressFill"></div>
        </div>
    </section>
</main>

<script>
const storageKey = "monthlyBudgetData_v2";
const defaultMonthKey = getCurrentMonthKey();
let currentMonthKey = defaultMonthKey;

const currencyFormatter = new Intl.NumberFormat("en-IN", {
    maximumFractionDigits: 0
});

function getCurrentMonthKey(date = new Date()) {
    const year = date.getFullYear();
    const month = String(date.getMonth() + 1).padStart(2, "0");
    return `${year}-${month}`;
}

function formatCurrency(value) {
    return `Rs. ${currencyFormatter.format(value || 0)}`;
}

function getMonthLabel(monthKey) {
    const [year, month] = monthKey.split("-");
    return new Date(Number(year), Number(month) - 1).toLocaleDateString("en-IN", {
        month: "long",
        year: "numeric"
    });
}

function moveMonth(monthKey, offset) {
    const [year, month] = monthKey.split("-").map(Number);
    const date = new Date(year, month - 1 + offset, 1);
    return getCurrentMonthKey(date);
}

function setSaveStatus(message) {
    document.getElementById("saveStatus").textContent = message;
}

function populateMonthSelector() {
    const select = document.getElementById("monthSelect");
    const currentYear = new Date().getFullYear();
    const fragment = document.createDocumentFragment();

    for (let year = currentYear - 1; year <= currentYear + 1; year++) {
        for (let month = 0; month < 12; month++) {
            const value = `${year}-${String(month + 1).padStart(2, "0")}`;
            const option = document.createElement("option");
            option.value = value;
            option.textContent = getMonthLabel(value);
            fragment.appendChild(option);
        }
    }

    select.appendChild(fragment);
    select.value = currentMonthKey;
    select.addEventListener("change", () => switchMonth(select.value));
}

function ensureMonthOption(monthKey) {
    const select = document.getElementById("monthSelect");
    if (Array.from(select.options).some(option => option.value === monthKey)) {
        return;
    }

    const option = document.createElement("option");
    option.value = monthKey;
    option.textContent = getMonthLabel(monthKey);
    select.appendChild(option);
    Array.from(select.options)
        .sort((a, b) => a.value.localeCompare(b.value))
        .forEach(sortedOption => select.appendChild(sortedOption));
}

function saveData() {
    const data = { income: [], expenses: [] };
    document.querySelectorAll("#incomeList .item").forEach(item => {
        const desc = item.querySelector(".description-input");
        const amount = item.querySelector(".amount-input");
        data.income.push({ desc: desc.value, amount: parseFloat(amount.value) || 0 });
    });
    document.querySelectorAll("#debitList .item").forEach(item => {
        const desc = item.querySelector(".description-input");
        const amount = item.querySelector(".amount-input");
        data.expenses.push({ desc: desc.value, amount: parseFloat(amount.value) || 0 });
    });

    try {
        const saved = JSON.parse(localStorage.getItem(storageKey) || "{}");
        const storageData = saved && typeof saved === "object" && !Array.isArray(saved) ? saved : {};
        storageData[currentMonthKey] = data;
        localStorage.setItem(storageKey, JSON.stringify(storageData));
        setSaveStatus("Saved automatically");
    } catch (error) {
        setSaveStatus("Save failed");
    }
}

function createDefaultRows(monthKey) {
    const hasNoSavedData = monthKey === defaultMonthKey && !localStorage.getItem(storageKey);
    if (hasNoSavedData) {
        createRow("incomeList", "Salary", 100000);
        createRow("debitList", "Home Loan", 30000);
        createRow("debitList", "Car Loan", 12400);
        createRow("debitList", "Loan from family", 12000);
        createRow("debitList", "Grocery and Maintenance", 10000);
        createRow("debitList", "Electricity bill", 10000);
        createRow("debitList", "Medical expenses", 10000);
        createRow("debitList", "Miscellaneous", 10000);
        return;
    }

    if (!document.querySelectorAll("#incomeList .item").length) {
        createRow("incomeList", "", 0);
    }
    if (!document.querySelectorAll("#debitList .item").length) {
        createRow("debitList", "", 0);
    }
}

function loadData(monthKey = currentMonthKey) {
    const saved = localStorage.getItem(storageKey);
    document.getElementById("incomeList").innerHTML = "";
    document.getElementById("debitList").innerHTML = "";
    currentMonthKey = monthKey;

    if (saved) {
        try {
            const data = JSON.parse(saved);
            const monthData = data[monthKey] || { income: [], expenses: [] };
            monthData.income.forEach(item => createRow("incomeList", item.desc, item.amount));
            monthData.expenses.forEach(item => createRow("debitList", item.desc, item.amount));
        } catch (error) {
            console.error(error);
        }
    }

    document.getElementById("activeMonth").textContent = getMonthLabel(monthKey);
    ensureMonthOption(monthKey);
    document.getElementById("monthSelect").value = monthKey;
    createDefaultRows(monthKey);
    calculate();
}

function switchMonth(monthKey) {
    saveData();
    loadData(monthKey);
}

function createRow(containerId, name = "", amount = 0) {
    const row = document.createElement("div");
    row.className = "item";

    const descriptionLabel = containerId === "incomeList" ? "Source" : "Expense";
    row.innerHTML = `
        <label class="field">
            <span>${descriptionLabel}</span>
            <input class="description-input" type="text" placeholder="Description" value="">
        </label>
        <label class="field">
            <span>Amount</span>
            <input class="amount-input" type="number" placeholder="0" value="" min="0" step="1" inputmode="numeric">
        </label>
        <button class="remove-btn" type="button" title="Remove row" aria-label="Remove row">&times;</button>
    `;

    row.querySelector(".description-input").value = name;
    row.querySelector(".amount-input").value = amount || "";

    row.querySelectorAll("input").forEach(input => {
        input.addEventListener("input", () => {
            calculate();
            saveData();
        });
    });

    let startX = 0;
    let currentX = 0;
    let isSwiping = false;
    const threshold = 85;

    row.addEventListener("touchstart", event => {
        startX = currentX = event.touches[0].clientX;
        isSwiping = true;
        row.classList.add("swiping");
    }, { passive: true });

    row.addEventListener("touchmove", event => {
        if (!isSwiping) return;
        currentX = event.touches[0].clientX;
        const diff = Math.min(0, currentX - startX);
        row.style.transform = `translateX(${diff}px)`;
    }, { passive: true });

    row.addEventListener("touchend", () => {
        if (!isSwiping) return;
        isSwiping = false;
        row.classList.remove("swiping");
        if (currentX - startX < -threshold) {
            removeRow(row);
        } else {
            row.style.transition = "transform 0.25s ease";
            row.style.transform = "translateX(0)";
        }
    });

    row.querySelector(".remove-btn").addEventListener("click", () => removeRow(row));
    document.getElementById(containerId).appendChild(row);
}

function removeRow(row) {
    const list = row.parentElement;
    if (list.querySelectorAll(".item").length === 1) {
        row.querySelectorAll("input").forEach(input => {
            input.value = "";
        });
        calculate();
        saveData();
        return;
    }

    row.style.opacity = "0";
    row.style.transform = "translateX(-28px)";
    setTimeout(() => {
        row.remove();
        calculate();
        saveData();
    }, 180);
}

function addIncome() {
    createRow("incomeList", "", 0);
    saveData();
    focusLastRow("incomeList");
}

function addDebit() {
    createRow("debitList", "", 0);
    saveData();
    focusLastRow("debitList");
}

function focusLastRow(containerId) {
    const rows = document.querySelectorAll(`#${containerId} .item`);
    const lastRow = rows[rows.length - 1];
    if (lastRow) {
        lastRow.querySelector(".description-input").focus();
    }
}

function sum(containerId) {
    let total = 0;
    document.querySelectorAll(`#${containerId} .amount-input`).forEach(input => {
        total += parseFloat(input.value) || 0;
    });
    return total;
}

function filledRowCount(containerId) {
    return Array.from(document.querySelectorAll(`#${containerId} .item`)).filter(item => {
        const description = item.querySelector(".description-input").value.trim();
        const amount = parseFloat(item.querySelector(".amount-input").value) || 0;
        return description || amount > 0;
    }).length;
}

function calculate() {
    const income = sum("incomeList");
    const expense = sum("debitList");
    const balance = income - expense;
    const spentPercent = income > 0 ? Math.round((expense / income) * 100) : 0;
    const progressPercent = Math.min(spentPercent, 100);
    const incomeRows = filledRowCount("incomeList");
    const expenseRows = filledRowCount("debitList");

    document.getElementById("incomeTotal").textContent = formatCurrency(income);
    document.getElementById("expenseTotal").textContent = formatCurrency(expense);
    document.getElementById("incomeSectionTotal").textContent = formatCurrency(income);
    document.getElementById("expenseSectionTotal").textContent = formatCurrency(expense);
    document.getElementById("incomeCount").textContent = `${incomeRows} ${incomeRows === 1 ? "source" : "sources"}`;
    document.getElementById("expenseCount").textContent = `${expenseRows} ${expenseRows === 1 ? "item" : "items"}`;
    document.getElementById("rowCount").textContent = `${incomeRows + expenseRows} entries`;

    const balanceEl = document.getElementById("balance");
    balanceEl.textContent = formatCurrency(balance);
    balanceEl.className = `metric-value ${balance >= 0 ? "income-text" : "negative"}`;
    document.getElementById("balanceNote").textContent = balance >= 0 ? "Available after expenses" : "Expenses exceed income";

    document.getElementById("spentRate").textContent = `${spentPercent}%`;
    document.getElementById("spentRate").className = `metric-value ${spentPercent > 100 ? "negative" : ""}`;
    document.getElementById("progressLabel").textContent = `${spentPercent}% used`;

    const progressFill = document.getElementById("progressFill");
    progressFill.style.width = `${progressPercent}%`;
    progressFill.classList.toggle("over", spentPercent > 100);
}

document.getElementById("addIncomeBtn").addEventListener("click", addIncome);
document.getElementById("addDebitBtn").addEventListener("click", addDebit);
document.getElementById("prevMonth").addEventListener("click", () => switchMonth(moveMonth(currentMonthKey, -1)));
document.getElementById("nextMonth").addEventListener("click", () => switchMonth(moveMonth(currentMonthKey, 1)));

populateMonthSelector();
loadData(currentMonthKey);
</script>
</body>
</html>
